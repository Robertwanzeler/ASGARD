name: greenran-ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements-runtime.txt pytest==9.0.2
      - name: Collect and run tests
        run: bash scripts/run_python_tests.sh
      - name: Compile Python sources
        run: python -m compileall -q src scripts apps tests drlexp push monitoring training
      - name: Check shell syntax
        run: find . -path './.git' -prune -o -name '*.sh' -type f -print0 | xargs -0 -n1 bash -n
      - name: Validate JSON contracts
        run: python scripts/validate_scientific_contracts.py
      - name: Validate configuration JSON
        run: >-
          find config -type f -name '*.json' ! -name 'priority_classes.json'
          -print0 | xargs -0 -r -n1 python -m json.tool >/dev/null
